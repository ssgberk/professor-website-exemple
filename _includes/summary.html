<section id="summary" class="ui cv-section basic vertical segment" aria-labelledby="summary-title">
    <h2 id="summary-title" class="ui dividing header cv-section-title"><i class="stream icon" aria-hidden="true"></i><span class="content">{% t sections.summary %}</span></h2>
    <h3 class="cv-sub-title">{% t sub.brief_biography %}</h3>
    <p class="cv-prose">{{ site.data.cv.summary.brief_biography | join: " " }}</p>
    <h3 class="cv-sub-title">{% t sub.highlights %}</h3>
    <ul class="cv-highlights">
        {% for entry in site.data.cv.summary.highlights %}<li><i class="check icon" aria-hidden="true"></i><span>{{ entry }}</span></li>{% endfor %}
    </ul>
</section>
