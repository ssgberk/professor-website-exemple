summary:
  brief_biography:
  - John Doe is a fictional associate professor of computer science at Example University, created for this demo site.
  - He received his Ph.D. in computer science (with distinction) from the Northfield Institute of Technology in 2012, and his bachelor's degree in applied mathematics from Springfield State College in 2007.
  - From September 2012 to August 2014, he was a postdoctoral researcher at Acme Research Lab, working on example data analysis.
  - From June 2011 to August 2011, he was a research intern at the Sample Computing Group, Placeholder University, studying toy information retrieval.
  - His doctoral research was focused on illustrative pattern recognition with synthetic low-quality data.
  - He participated in various fictional contests and challenges, winning placeholder awards in the fields of data mining, teaching, programming, etc.
  - His teaching interest lies in the general area of algorithms and software engineering.
  - His research interests include machine learning, example data mining, information retrieval, human-computer interaction, and scientific computing.
  highlights:
  - 10+ years of teaching and research experience (fictional).
  - Solid expertise in Python, HTML, CSS, JavaScript, and various algorithms/frameworks.
  - Experienced in MATLAB, C++, Java, SQL, UNIX/Linux Shell, and LaTeX.
  - Contributed to various open source projects (all fictional).
  - Supervised 12 example graduate students.
  - Taught 8 different courses at Example University.
  - Runs 5 km every weekend; finished a fictional marathon (PB 4:00:00).

